# NHN Cloud 콘솔 안내 챗봇 — 쿠버네티스 배포 (네임스페이스 nhn-docs-bot)
#
# 미리 만들어 둘 것 (git 에 넣지 않는다):
#   kubectl -n nhn-docs-bot create secret generic llm --from-literal=NVIDIA_API_KEY=...
#   kubectl -n nhn-docs-bot create secret generic db \
#       --from-literal=POSTGRES_USER=devops \
#       --from-literal=POSTGRES_PASSWORD='<강한 비밀번호>'
#   kubectl -n nhn-docs-bot create secret docker-registry regcred ...   (또는 기존 풀 시크릿 복사)
#   kubectl -n nhn-docs-bot create secret generic admin \
#       --from-literal=ADMIN_TOKEN="$(openssl rand -base64 24)"
#   (관리자 페이지 토큰. 조회: kubectl -n nhn-docs-bot get secret admin \
#    -o jsonpath='{.data.ADMIN_TOKEN}' | base64 -d — optional 이라 시크릿이 없어도 앱은 뜬다,
#    다만 그때는 관리자 페이지가 보호되지 않는다.)
#
# 시크릿 db 는 pgvector(POSTGRES_USER/POSTGRES_PASSWORD)와 앱(DB_USER/DB_PASSWORD)이
# 같은 값을 공유한다. 비밀번호를 바꾸면 pgvector 는 이미 초기화된 PGDATA 의 계정을
# 그대로 쓰므로, 시크릿만 바꾸면 안 되고 DB 안에서 ALTER ROLE 도 함께 해야 한다.
#
# 이미지 태그는 배포 시 `kubectl set image` 또는 sed 로 바꾼다.
# 컨테이너는 uid 1000(app) 으로 뜬다. docs PVC 의 파일은 refresh CronJob 이 같은 uid 로 쓴다.
apiVersion: v1
kind: Namespace
metadata:
  name: nhn-docs-bot
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: nhn-docs-bot
spec:
  accessModes: [ReadWriteOnce]
  # 주의: sc-nas-cicd 는 NFS 다. NFS 위의 Postgres 는 알려진 위험이다 —
  # 파일 잠금(lockd)과 fsync 의미가 로컬 파일시스템과 달라, 노드가 갑자기 죽으면
  # 데이터 손상이나 기동 실패가 날 수 있다. 블록 StorageClass(예: sc-block-*)가
  # 생기면 그쪽으로 옮긴다. 지금은 코퍼스 재적재로 언제든 복구 가능해 감수한다.
  storageClassName: sc-nas-cicd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docs
  namespace: nhn-docs-bot
spec:
  accessModes: [ReadWriteMany]
  storageClassName: sc-nas-cicd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: nhn-docs-bot
spec:
  selector:
    app: pgvector
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgvector
  namespace: nhn-docs-bot
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - { name: POSTGRES_DB, value: ragdb }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: db, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db, key: POSTGRES_PASSWORD }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
          # 기동은 느릴 수 있고(NFS 위 복구), 죽은 뒤 매달려 있는 것이 더 나쁘다.
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: nhn-docs-bot
spec:
  selector:
    app: ui
  ports:
    - port: 8501
      targetPort: 8501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: nhn-docs-bot
spec:
  replicas: 1
  # docs PVC 는 ReadWriteMany 지만, BM25 인덱스를 프로세스마다 다시 만드는 비용
  # (2.73M 토큰, ~130MB)이 크고 롤링 중 두 파드가 동시에 인덱싱하면 메모리가 튄다.
  # 옛 파드를 먼저 내리고 새 파드를 올린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      # Service 'db' 때문에 DB_PORT=tcp://… 가 자동 주입되어 앱의 DB_PORT 와 충돌한다.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: regcred
      containers:
        - name: ui
          image: harbor.114-110-181-178.nip.io/nnd/nhn-docs-bot:latest
          env:
            - { name: DB_HOST, value: db }
            - { name: DB_PORT, value: "5432" }
            - { name: DOCS_DIR, value: /docs }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db, key: POSTGRES_PASSWORD }
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef: { name: llm, key: NVIDIA_API_KEY }
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: admin, key: ADMIN_TOKEN, optional: true }
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 10
            periodSeconds: 10
          # BM25 인덱스를 만드는 동안(수십 초) 죽이지 않도록 넉넉히 기다린다.
          livenessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - name: docs
              mountPath: /docs
              readOnly: true
      volumes:
        - name: docs
          persistentVolumeClaim:
            claimName: docs
