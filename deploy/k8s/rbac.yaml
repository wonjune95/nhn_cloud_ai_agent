# refresh CronJob 이 적재 뒤 UI 를 재시작(rollout restart = deployment patch)할 최소 권한.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: refresh
  namespace: nhn-docs-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: refresh-restart-ui
  namespace: nhn-docs-bot
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # ui Deployment 하나만 — 네임스페이스의 다른 Deployment 는 건드릴 수 없게 한다.
    resourceNames: ["ui"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: refresh-restart-ui
  namespace: nhn-docs-bot
subjects:
  - kind: ServiceAccount
    name: refresh
    namespace: nhn-docs-bot
roleRef:
  kind: Role
  name: refresh-restart-ui
  apiGroup: rbac.authorization.k8s.io
